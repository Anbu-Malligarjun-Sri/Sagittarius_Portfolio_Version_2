
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes typebar{0%{box-shadow:0 0 0 0 rgba(255,215,100,0)}25%{box-shadow:0 0 18px 5px rgba(255,215,100,.55)}100%{box-shadow:0 0 0 0 rgba(255,215,100,0)}}
@keyframes ray{0%,100%{opacity:.18}50%{opacity:.27}}
.blink{animation:blink 1.1s step-end infinite;display:inline-block;width:2px;height:.9em;background:#1a1008;vertical-align:middle;margin-left:1px;}
.flash{animation:typebar .26s ease-out;}
.ray1{animation:ray 7s ease-in-out infinite;}
.ray2{animation:ray 5s ease-in-out infinite;animation-delay:2.5s;}
input,textarea{background:transparent;border:none;outline:none;color:transparent;caret-color:#1a1008;font-family:'Special Elite',monospace;font-size:11.5px;resize:none;}
input::selection,textarea::selection{background:rgba(180,140,80,.25);}
</style>

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useRef}=React;

const FIELDS=[
  {key:'name',    label:'1. Full Name',       ph:'______________________________',  top:56,  lx:0,vx:152,w:298},
  {key:'address', label:'2. Primary Address', ph:'___________________',             top:90,  lx:0,vx:182,w:274},
  {key:'contact', label:'3. Contact Number',  ph:'___________________',             top:124, lx:0,vx:178,w:278},
  {key:'email',   label:'4. Email Address',   ph:'_______________________',         top:158, lx:0,vx:162,w:294},
  {key:'notes',   label:'5. Notes',           ph:'____________________________',    top:193, lx:0,vx:96, w:360,multi:true,h:62},
];

const ROWS=[
  ['SARWD','1','2','3','4','5','6','7','8','9','0','—'],
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['LOCK','A','S','D','F','G','H','J','K','L','↵'],
  ['A','S','D','V','B','N','K',':',';'],
  ['SHIFT','Z','X','C','V','B','M','Sgt','SHIFT'],
];

function Key({label,flash}){
  const wide=['SARWD','LOCK','SHIFT','Sgt','↵'].includes(label);
  if(!label)return React.createElement('div',{style:{width:44,height:44,visibility:'hidden',flexShrink:0}});
  return React.createElement('div',{
    className:flash?'flash':'',
    style:{
      width:wide?62:44,height:44,borderRadius:'50%',flexShrink:0,
      background:'radial-gradient(circle at 38% 30%,#3e342a 0%,#1e1712 50%,#0a0806 100%)',
      border:'2px solid #7d6852',
      boxShadow:'inset 0 2px 0 rgba(255,255,255,.09),inset 0 -2px 4px rgba(0,0,0,.6),0 5px 12px rgba(0,0,0,.6)',
      display:'flex',alignItems:'center',justifyContent:'center',
      color:'#eadec8',fontSize:wide?7.5:11,
      fontFamily:"'Courier Prime',monospace",fontWeight:700,
      letterSpacing:wide?'0.15em':'0.04em',userSelect:'none',cursor:'default',
    }
  },label);
}

function Spool({side}){
  return React.createElement('div',{style:{
    position:'absolute',top:80,[side]:26,
    width:108,height:108,borderRadius:'50%',
    background:'radial-gradient(circle at 34% 30%,#e8ddd0 0%,#7a6350 16%,#2a2420 54%,#060404 100%)',
    border:'1.5px solid #6d5c4a',boxShadow:'0 14px 28px rgba(0,0,0,.42)',
  }},
    React.createElement('div',{style:{position:'absolute',inset:15,borderRadius:'50%',border:'1px solid rgba(255,255,255,.08)'}}),
    React.createElement('div',{style:{position:'absolute',inset:36,borderRadius:'50%',background:'radial-gradient(circle,rgba(255,255,255,.1),rgba(0,0,0,.3))',border:'1px solid rgba(255,255,255,.14)'}}),
    [45,135].map(a=>React.createElement('div',{key:a,style:{position:'absolute',left:'50%',top:'50%',width:'54%',height:2,background:'rgba(255,255,255,.1)',transformOrigin:'left center',transform:`translateY(-50%) rotate(${a}deg)`}}))
  );
}

function Lever({side}){
  return React.createElement('div',{style:{position:'absolute',top:66,[side]:12,width:32,height:178,zIndex:2}},
    React.createElement('div',{style:{
      position:'absolute',top:0,[side==='left'?'right':'left']:10,
      width:6,height:144,borderRadius:4,
      background:'linear-gradient(180deg,#d9bc98 0%,#7a5c3a 40%,#1f1510 100%)',
      transform:side==='left'?'rotate(-16deg)':'rotate(14deg)',transformOrigin:'top center',
    }}),
    React.createElement('div',{style:{
      position:'absolute',bottom:22,[side==='left'?'right':'left']:0,
      width:22,height:22,borderRadius:'50%',
      background:'radial-gradient(circle at 32% 28%,rgba(255,255,255,.28),rgba(255,255,255,.06) 40%,rgba(0,0,0,.48) 80%)',
      border:'1px solid rgba(255,255,255,.1)',
    }})
  );
}

function FieldRow({spec,value,active,onFocus,onBlur,onChange}){
  const display=value.trim()||spec.ph;
  const ink='#1a1008';
  return React.createElement('div',{style:{position:'absolute',top:spec.top,left:20,right:20,height:spec.h||28}},
    React.createElement('span',{style:{
      position:'absolute',top:0,left:spec.lx,
      fontFamily:"'Special Elite',monospace",fontSize:11,fontWeight:700,
      letterSpacing:'.04em',color:ink,pointerEvents:'none',whiteSpace:'nowrap',
    }},spec.label+':'),
    React.createElement('span',{style:{
      position:'absolute',
      top:spec.multi?17:0,left:spec.vx,width:spec.w,
      fontFamily:"'Special Elite',monospace",fontSize:11,color:ink,
      whiteSpace:'pre-wrap',wordBreak:'break-word',lineHeight:'1.85',pointerEvents:'none',
    }},display,active&&React.createElement('span',{className:'blink'})),
    active&&React.createElement('div',{style:{
      position:'absolute',
      top:spec.multi?11:-4,left:spec.vx-6,
      width:spec.w+12,height:spec.multi?(spec.h||62)+6:32,
      borderRadius:5,border:'1px solid rgba(210,180,120,.7)',
      background:'rgba(255,255,255,.04)',pointerEvents:'none',
    }}),
    spec.multi
      ?React.createElement('textarea',{style:{position:'absolute',top:17,left:spec.vx,width:spec.w,height:spec.h||62},value,onFocus,onBlur,onChange:e=>onChange(e.target.value)})
      :React.createElement('input',{type:'text',style:{position:'absolute',top:0,left:spec.vx,width:spec.w,height:26},value,onFocus,onBlur,onChange:e=>onChange(e.target.value)})
  );
}

function App(){
  const [form,setForm]=useState({name:'',address:'',contact:'',email:'',notes:''});
  const [active,setActive]=useState(null);
  const [flashKey,setFlashKey]=useState(null);

  useEffect(()=>{
    const h=e=>{
      const k=e.key.toUpperCase();
      const match=ROWS.flat().find(x=>x===k);
      if(match){setFlashKey(match);setTimeout(()=>setFlashKey(null),260);}
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[]);

  const handleChange=useCallback((key,val)=>setForm(f=>({...f,[key]:val})),[]);

  return React.createElement('div',{style:{
    minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
    background:'radial-gradient(circle at 50% 0%,#8c1c22 0%,#580e14 38%,#1f0507 100%)',
    overflow:'hidden',position:'relative',padding:'1.5rem',
  }},
    // Light rays
    React.createElement('div',{className:'ray1',style:{position:'absolute',top:-60,left:-60,width:440,height:720,background:'rgba(255,230,190,.1)',transform:'rotate(32deg)',pointerEvents:'none',borderRadius:4}}),
    React.createElement('div',{className:'ray2',style:{position:'absolute',top:80,right:50,width:300,height:580,background:'rgba(255,215,170,.06)',transform:'rotate(20deg)',pointerEvents:'none',borderRadius:4}}),

    // Outer bezel
    React.createElement('div',{style:{
      position:'relative',width:'100%',maxWidth:1080,
      borderRadius:36,border:'1px solid rgba(255,255,255,.08)',
      background:'linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.06))',
      boxShadow:'0 36px 120px rgba(0,0,0,.55)',padding:'1.25rem',
    }},
      // Machine interior
      React.createElement('div',{style:{
        position:'relative',minHeight:820,borderRadius:28,overflow:'hidden',
        background:'radial-gradient(circle at 50% 0%,#b85042 0%,#6c1016 40%,#1a0405 100%)',
        display:'flex',alignItems:'center',justifyContent:'center',
      }},
        // Ambient blobs
        React.createElement('div',{style:{position:'absolute',left:'6%',top:'7%',width:230,height:230,borderRadius:'50%',background:'rgba(255,255,255,.04)',filter:'blur(80px)',pointerEvents:'none'}}),
        React.createElement('div',{style:{position:'absolute',right:'7%',top:'9%',width:210,height:210,borderRadius:'50%',background:'rgba(255,140,90,.06)',filter:'blur(90px)',pointerEvents:'none'}}),

        // Full layout container
        React.createElement('div',{style:{position:'absolute',inset:0}},

          // ── CARRIAGE ASSEMBLY ──
          React.createElement('div',{style:{position:'absolute',left:'50%',top:18,transform:'translateX(-50%)',width:640}},
            // Top guide bar
            React.createElement('div',{style:{position:'absolute',left:'50%',top:0,transform:'translateX(-50%)',width:330,height:19,borderRadius:10,background:'#e2d7c5',boxShadow:'0 8px 18px rgba(0,0,0,.26)'}}),
            // Platen
            React.createElement('div',{style:{position:'absolute',left:'50%',top:7,transform:'translateX(-50%)',width:268,height:27,borderRadius:8,background:'linear-gradient(180deg,#f4edde,#d3c2a0)',boxShadow:'0 6px 14px rgba(0,0,0,.22)',zIndex:1}}),
            React.createElement(Spool,{side:'left'}),
            React.createElement(Spool,{side:'right'}),
            React.createElement(Lever,{side:'left'}),
            React.createElement(Lever,{side:'right'}),

            // Paper
            React.createElement('div',{style:{
              position:'absolute',left:'50%',top:64,transform:'translateX(-50%)',
              width:510,height:290,borderRadius:12,
              background:'#f7f0e2',boxShadow:'0 14px 28px rgba(0,0,0,.3)',overflow:'hidden',
            }},
              React.createElement('div',{style:{position:'absolute',inset:0,background:'radial-gradient(circle at top left,rgba(255,255,255,.55),transparent 30%),linear-gradient(135deg,rgba(255,255,255,.18),transparent 38%,rgba(0,0,0,.03))',pointerEvents:'none'}}),
              React.createElement('div',{style:{
                position:'absolute',inset:9,borderRadius:8,
                background:'linear-gradient(180deg,#faf2e3 0%,#f1e8d4 78%,#dfccad 100%)',
                border:'1px solid rgba(170,145,105,.22)',padding:'14px 24px',
              }},
                React.createElement('div',{style:{textAlign:'center',fontFamily:"'Special Elite',monospace",fontSize:12,fontWeight:700,letterSpacing:'.28em',color:'#1a1410',marginBottom:8}}, 'INFORMATION QUESTIONNAIRE'),
                React.createElement('div',{style:{height:1,background:'rgba(100,78,52,.14)',marginBottom:6}}),
                FIELDS.map(f=>React.createElement(FieldRow,{
                  key:f.key,spec:f,value:form[f.key]||'',
                  active:active===f.key,
                  onFocus:()=>setActive(f.key),
                  onBlur:()=>setActive(null),
                  onChange:v=>handleChange(f.key,v),
                }))
              )
            ),
            // Shadow
            React.createElement('div',{style:{position:'absolute',left:'50%',top:262,transform:'translateX(-50%)',width:'68%',height:14,background:'rgba(0,0,0,.38)',borderRadius:'50%',filter:'blur(5px)'}}),
            // Feed roller
            React.createElement('div',{style:{position:'absolute',left:'50%',top:266,transform:'translateX(-50%)',width:450,height:36,borderRadius:19,background:'linear-gradient(180deg,#231812,#080808)',boxShadow:'0 10px 22px rgba(0,0,0,.4)'}})
          ),

          // ── KEYBOARD ──
          React.createElement('div',{style:{
            position:'absolute',left:'50%',top:318,transform:'translateX(-50%)',
            width:660,borderRadius:32,
            background:'linear-gradient(180deg,rgba(18,13,12,.99),rgba(5,5,6,1))',
            border:'1px solid rgba(255,255,255,.055)',
            boxShadow:'0 20px 40px rgba(0,0,0,.5)',
            padding:'14px 18px 18px',
          }},
            React.createElement('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:9,fontSize:7.5,letterSpacing:'.36em',color:'rgba(255,255,255,.2)',fontFamily:"'Courier Prime',monospace",textTransform:'uppercase'}},
              React.createElement('span',null,'mechanical keyboard'),
              React.createElement('span',null,'silent but alive')
            ),
            React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:6}},
              ROWS.map((row,ri)=>
                React.createElement('div',{key:ri,style:{display:'flex',justifyContent:'center',gap:5}},
                  row.map((label,ki)=>React.createElement(Key,{key:`${ri}-${ki}`,label,flash:flashKey===label&&label!==''}))
                )
              )
            ),
            React.createElement('div',{style:{marginTop:11,display:'flex',justifyContent:'center'}},
              React.createElement('div',{style:{height:20,width:'62%',borderRadius:11,background:'linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015))',border:'1px solid rgba(255,255,255,.055)'}})
            ),
            React.createElement('div',{style:{display:'flex',justifyContent:'space-between',marginTop:9,padding:'0 6px',fontSize:7.5,letterSpacing:'.32em',color:'rgba(255,255,255,.18)',fontFamily:"'Courier Prime',monospace",textTransform:'uppercase'}},
              React.createElement('span',null,active?`typing · ${active}`:'ready to type'),
              React.createElement('span',null,form.notes?'paper loaded':'blank sheet')
            )
          ),

          // Tagline
          React.createElement('div',{style:{position:'absolute',bottom:14,left:'50%',transform:'translateX(-50%)',fontSize:8,letterSpacing:'.44em',color:'rgba(255,255,255,.2)',fontFamily:"'Courier Prime',monospace",textTransform:'uppercase',whiteSpace:'nowrap'}},
            'hover the paper · type on the paper · watch the typebars glow'
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
